ignores:
  # Bin-only tools: invoked from `scripts`, never imported, so depcheck cannot see them.
  - '@vitest/coverage-v8'
  - depcheck
  - npm-run-all2
  - rimraf
  - tsdown
  - typescript
  - jsdom
  # Used by the vitest global setup that boots the service the specs talk to.
  - '@mocktomata/service'
