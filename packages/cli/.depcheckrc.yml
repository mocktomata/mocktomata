ignores:
  # Bin-only tools: invoked from `scripts`, never imported, so depcheck cannot see them.
  - '@vitest/coverage-v8'
  - depcheck
  - npm-run-all2
  - rimraf
  - tsdown
  - typescript
  # Type-only: needed so the declaration of `serveCommand` can name clibuilder's `t` option types.
  - args-minus
